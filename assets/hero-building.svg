    <rect x="228" y="336" width="42" height="42" rx="4"/>
    <rect x="288" y="336" width="42" height="42" rx="4"/>
    <rect x="348" y="336" width="42" height="42" rx="4"/>
    <rect x="408" y="336" width="42" height="42" rx="4"/>
    <rect x="168" y="406" width="42" height="42" rx="4"/>
    <rect x="228" y="406" width="42" height="42" rx="4"/>
    <rect x="288" y="406" width="42" height="42" rx="4"/>
    <rect x="348" y="406" width="42" height="42" rx="4"/>
    <rect x="408" y="406" width="42" height="42" rx="4"/>
    <rect x="168" y="476" width="42" height="42" rx="4"/>
