<svg viewBox="0 0 640 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf3fb"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0066cc"/>
      <stop offset="100%" stop-color="#004a99"/>
    </linearGradient>
  </defs>
  <rect width="640" height="760" fill="url(#skyGrad)"/>
  <ellipse cx="320" cy="700" rx="230" ry="18" fill="#0b132b" opacity="0.06"/>

  <!-- side landscaping -->
