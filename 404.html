<style>
  :root {
    --navy: #0b132b; --blue: #0066cc; --teal: #0a8a9c; --ice-1: #eaf3fb;
    --font-display: 'Fraunces', serif; --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--navy);
    background-image: radial-gradient(ellipse 900px 500px at 15% -10%, rgba(0,102,204,0.22), transparent 60%),
                       radial-gradient(ellipse 700px 500px at 100% 10%, rgba(10,138,156,0.14), transparent 55%);
    font-family: var(--font-body);
    color: #f3f7fd;
    padding: 24px;
  }
  .wrap { max-width: 520px; text-align: center; }
  .mark { width: 64px; height: 64px; margin: 0 auto 28px; }
  .code { font-family: var(--font-display); font-weight: 700; font-size: 84px; color: #fff; margin: 0; line-height: 1; }
  h1 { font-family: var(--font-display); font-weight: 600; font-size: 26px; margin: 14px 0 12px; color: #fff; }
  p { font-size: 15px; color: #b7c4de; margin: 0 0 32px; line-height: 1.7; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 28px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 13px 26px; border-radius: 999px;
    font-weight: 600; font-size: 14.5px; text-decoration: none; transition: transform 0.3s ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn--primary { background: linear-gradient(120deg, var(--blue), #004a99); color: #fff; }
  .btn--outline { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: #fff; }
  .helpline { font-size: 13.5px; color: #8ea3c9; }
  .helpline a { color: #7fe6f4; font-weight: 600; text-decoration: none; }
</style>
</head>
